type: grid
title: Sonda Weather Station
columns: 3
square: false
cards:
  - type: custom:mushroom-template-card
    primary: Temp
    secondary: >
      {% if states('sensor.sonda_temperature') in ['unavailable', 'unknown'] %}
        Not found
      {% else %}
        {{ states('sensor.sonda_temperature') }}°F
      {% endif %}
    icon: mdi:thermometer
    icon_color: >
      {% if states('sensor.sonda_temperature') in ['unavailable', 'unknown'] %}
        red
      {% else %}
        orange
      {% endif %}

  - type: custom:mushroom-template-card
    primary: Humidity
    secondary: >
      {% if states('sensor.sonda_humidity') in ['unavailable', 'unknown'] %}
        Not found
      {% else %}
        {{ states('sensor.sonda_humidity') }}%
      {% endif %}
    icon: mdi:water-percent
    icon_color: >
      {% if states('sensor.sonda_humidity') in ['unavailable', 'unknown'] %}
        red
      {% else %}
        blue
      {% endif %}

  - type: custom:mushroom-template-card
    primary: Pressure
    secondary: >
      {% if states('sensor.sonda_pressure') in ['unavailable', 'unknown'] %}
        Not found
      {% else %}
        {{ states('sensor.sonda_pressure') }} hPa
      {% endif %}
    icon: mdi:gauge
    icon_color: >
      {% if states('sensor.sonda_pressure') in ['unavailable', 'unknown'] %}
        red
      {% else %}
        purple
      {% endif %}

  - type: custom:mushroom-template-card
    primary: Light
    secondary: >
      {% if states('sensor.sonda_light_intensity') in ['unavailable', 'unknown'] %}
        Not found
      {% else %}
        {{ states('sensor.sonda_light_intensity') }} lx
      {% endif %}
    icon: mdi:brightness-5
    icon_color: >
      {% if states('sensor.sonda_light_intensity') in ['unavailable', 'unknown'] %}
        red
      {% else %}
        yellow
      {% endif %}

  - type: custom:mushroom-template-card
    primary: Rain
    secondary: >
      {% if states('sensor.sonda_rain_intensity') in ['unavailable', 'unknown'] %}
        Not found
      {% else %}
        {{ states('sensor.sonda_rain_intensity') }}%
      {% endif %}
    icon: mdi:weather-rainy
    icon_color: >
      {% if states('sensor.sonda_rain_intensity') in ['unavailable', 'unknown'] %}
        red
      {% else %}
        cyan
      {% endif %}

  - type: custom:mushroom-template-card
    primary: Air Quality
    secondary: >
      {% if states('sensor.sonda_air_quality_mq135') in ['unavailable', 'unknown'] %}
        Not found
      {% else %}
        {{ states('sensor.sonda_air_quality_mq135') }} V
      {% endif %}
    icon: mdi:air-filter
    icon_color: >
      {% if states('sensor.sonda_air_quality_mq135') in ['unavailable', 'unknown'] %}
        red
      {% else %}
        green
      {% endif %}

  - type: custom:mushroom-template-card
    primary: Smoke
    secondary: >
      {% if states('sensor.sonda_smoke_mq2') in ['unavailable', 'unknown'] %}
        Not found
      {% else %}
        {{ states('sensor.sonda_smoke_mq2') }} V
      {% endif %}
    icon: mdi:smoke-detector
    icon_color: >
      {% if states('sensor.sonda_smoke_mq2') in ['unavailable', 'unknown'] %}
        red
      {% else %}
        red
      {% endif %}
